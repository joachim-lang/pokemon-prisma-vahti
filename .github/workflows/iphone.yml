name: iPhone 17 hintavahti

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Palauta tila
        uses: actions/cache/restore@v4
        with:
          path: data/iphone_state.json
          key: iphone-state-${{ github.run_number }}
          restore-keys: |
            iphone-state-

      - name: Tarkista hinnat
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IPHONE_PRICE_THRESHOLD: "800"
        run: python iphone_watcher.py --once --announce

      - name: Tallenna tila
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/iphone_state.json
          key: iphone-state-${{ github.run_number }}
