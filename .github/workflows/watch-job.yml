name: Ostoskorivahti

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: pokemon-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Palauta tila
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: scraper-state-${{ github.run_number }}
          restore-keys: |
            scraper-state-

      - name: Nopea ostoskorivahti
        env:
          FAST_CHECK_SECONDS: "8"
        run: python scraper.py --fast --fast-for 21000

      - name: Tallenna tila
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: scraper-state-${{ github.run_number }}
